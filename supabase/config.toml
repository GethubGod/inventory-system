# Supabase Local Development Configuration
# Run `supabase start` to spin up local services

[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
major_version = 15

[studio]
enabled = true
port = 54423

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081", "babytunasystems://auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.quick-order-voice-stream]
verify_jwt = false

# Invite acceptance happens before a user has a session. Its opaque, single-use
# token is validated by the function with service-role database access.
[functions.accept-invite]
verify_jwt = false

# Name + PIN/password sign-in also happens before a session exists. The
# function requires the anon key and verifies the credential in Postgres
# (bcrypt + rate limits) via a service-role-only RPC.
[functions.login-with-name]
verify_jwt = false

# Tips web app entry endpoints use their own session-token auth (entry devices
# have no Supabase JWT beyond the anon key). The HTTP functions still require
# the anon key as bearer; the WebSocket stream cannot send headers at all.
[functions.tip-voice-stream]
verify_jwt = false
